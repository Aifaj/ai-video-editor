<div class="dashboard-wrapper">

  <!-- Animated Background -->
  <div class="animated-bg">
    <span class="shape shape1"></span>
    <span class="shape shape2"></span>
    <span class="shape shape3"></span>
    <span class="shape shape4"></span>
  </div>

  <!-- Hero Section -->
  <section class="hero">
    <div>
      <h1 class="title">AI Creation Studio</h1>
      <p class="subtitle">Edit photos, videos, AI shorts and Gemini—designed with futuristic UI.</p>
    </div>

    <img src="assets/img/dashboard-hero.jfif" class="hero-art" alt="Hero Art">
  </section>

  <!-- Feature Cards -->
  <div class="row g-4 mt-4">
    <div class="col-md-6 col-lg-3" *ngFor="let tool of tools">
      <div class="feature-card">

        <div class="icon-box" [ngClass]="tool.bg">
          <i class="{{ tool.icon }}"></i>
        </div>

        <h5>{{ tool.title }}</h5>
        <p>{{ tool.desc }}</p>

        <a [routerLink]="tool.link" class="btn btn-outline-light w-100">Open</a>
      </div>
    </div>
  </div>

</div>
